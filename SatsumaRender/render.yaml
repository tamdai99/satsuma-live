services:
  - type: web
    name: satsuma-live
    runtime: python
    region: singapore
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: OPENAI_API_KEY
        sync: false
      - key: SENDER_TOKEN
        sync: false
