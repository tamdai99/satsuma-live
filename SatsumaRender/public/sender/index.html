<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薩摩会議 Audio Sender</title><link rel="stylesheet" href="style.css"><main><header><span class="tag">SATSUMA MEETING · AUDIO</span><h1>会場の音声を、2系統で送信</h1><p>USBオーディオインターフェースの入力1と入力2を、それぞれ字幕サーバーへ送ります。</p></header><section><label>入力デバイス<div class="row"><select id="device" aria-label="入力デバイス"></select><button id="refresh">デバイスを確認</button></div></label><p id="hardware">まず「デバイスを確認」を押し、マイクへのアクセスを許可してください。</p><div class="channels"><article><span>INPUT 1</span><h2>中国語 → 日本語</h2><meter id="meter1" min="0" max="1" value="0"></meter><p id="level1">−∞ dBFS</p></article><article><span>INPUT 2</span><h2>日本語 → 繁体字</h2><meter id="meter2" min="0" max="1" value="0"></meter><p id="level2">−∞ dBFS</p></article></div><label class="check"><input id="verified" type="checkbox"> 片方ずつマイクをテストし、入力1・入力2が別々に動くことを確認しました</label><div class="actions"><button id="preview">入力テスト</button><button id="release" disabled>入力を閉じる</button></div></section><section><label>字幕サーバーの受信URL<input id="url" placeholder="wss://your-server.example/ingest" autocomplete="off" spellcheck="false"></label><label>会場PC用の送信トークン<input id="token" type="password" autocomplete="off" placeholder="OpenAIのAPIキーではありません"></label><div class="actions"><button class="primary" id="start" disabled>送信開始</button><button id="stop" disabled>送信停止</button></div><p id="status" role="status" aria-live="polite">待機中</p><div class="stats"><span id="frames">送信 0 パケット</span><span id="drops">欠落 0 パケット</span><span id="ack">サーバー応答 —</span></div></section><footer>Macのスリープを解除し、この画面を開いたまま運用してください。音声の録音・会場への再生は行いません。</footer></main><script type="module" src="app.js"></script></html>
