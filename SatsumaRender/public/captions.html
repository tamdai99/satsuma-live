<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ライブ字幕</title><style>html{overflow-y:scroll;scrollbar-gutter:stable}body{background:#0c211c;color:#f3f7ef;font-family:-apple-system,sans-serif;margin:0;padding:24px}header{position:sticky;top:0;background:#0c211c;padding:12px 0;border-bottom:1px solid #355147}h1{font-size:18px;margin:0 0 12px}.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center}a,button{color:#c1dccb}button{background:#244539;border:0;padding:8px 12px;border-radius:6px}#text{font-size:28px;line-height:1.8;white-space:pre;font-kerning:none;font-variant-ligatures:none;overflow-x:auto;text-align:left;margin:30px auto;max-width:900px}.caption-line{min-height:1.8em;white-space:pre}.caption-char{display:inline-block;vertical-align:baseline;white-space:pre}#state{color:#afd2bb;font-size:13px}footer{font-size:12px;color:#91b39f}</style><header><h1 id="title"></h1><div class="controls"><a href="/">言語選択</a><button id="small">文字 −</button><button id="large">文字 ＋</button><label><input type="checkbox" checked id="follow"> 自動スクロール</label></div><p id="state">接続中…</p></header><div id="text">字幕を待っています。</div><footer>AIによる翻訳字幕です。</footer><script>
const language=location.pathname.endsWith('/zh')?'zh':'ja', zh=language==='zh';document.documentElement.lang=zh?'zh-Hant':'ja';document.querySelector('#title').textContent=zh?'薩摩會議 繁體中文字幕':'薩摩会議 日本語字幕';let size=28;
const t=document.querySelector('#text'),s=document.querySelector('#state');document.querySelector('#small').onclick=()=>{size=Math.max(18,size-2);t.style.fontSize=size+'px';rebuild()};document.querySelector('#large').onclick=()=>{size=Math.min(48,size+2);t.style.fontSize=size+'px';rebuild()};
// Freeze line breaks and glyph advances: incoming punctuation cannot reflow old text.
let previousText='', visibleText='', line=null, lineWidth=0, layoutWidth=0;
function resetLayout(){
 t.replaceChildren();line=null;lineWidth=0;layoutWidth=Math.max(1,t.clientWidth);
}
function newLine(){line=document.createElement('div');line.className='caption-line';line.dataset.length='0';t.append(line);lineWidth=0;}
function appendText(value){
 for(const char of value){
  if(!line)newLine();
  if(char==='\n'){line.dataset.length=Number(line.dataset.length)+1;newLine();continue;}
  // Use the actual rendered glyph width, including fallback fonts and browser zoom.
  // Canvas's default 10px font can differ from the displayed font and cause overlaps.
  const glyph=document.createElement('span');glyph.className='caption-char';glyph.textContent=char;line.append(glyph);
  const width=glyph.getBoundingClientRect().width;
  if(lineWidth>0&&lineWidth+width>layoutWidth){newLine();line.append(glyph);}
  line.dataset.length=Number(line.dataset.length)+char.length;lineWidth+=width;
 }
}
function rebuild(){resetLayout();if(visibleText)appendText(visibleText);else t.textContent=zh?'等待字幕。':'字幕を待っています。';}
function receiveText(next){
 if(next===previousText)return false;
 let delta=null;
 if(next.startsWith(previousText))delta=next.slice(previousText.length);
 else if(next&&previousText){
  // Server keeps the latest 6000 characters: retain frozen lines across that window.
  for(let n=Math.min(previousText.length,next.length);n>0;n--){
   if(previousText.endsWith(next.slice(0,n))){delta=next.slice(n);break;}
  }
 }
 if(!next||delta===null){visibleText=next;rebuild();}
 else{
  if(!visibleText){resetLayout();}
  visibleText+=delta;appendText(delta);
  // Remove complete old lines only, so remaining lines keep their breaks.
  while(visibleText.length>6000&&t.children.length>1){
   const first=t.firstElementChild;const count=Number(first.dataset.length);
   first.remove();visibleText=visibleText.slice(count);
  }
 }
 previousText=next;return true;
}
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(Math.abs(t.clientWidth-layoutWidth)>1)rebuild();},150);});
document.fonts.ready.then(()=>rebuild());
const states=zh?{waiting:'等待音訊',connecting:'連接翻譯服務',live:'LIVE',draining:'正在處理最後的字幕',stopped:'已停止',unavailable:'服務中斷',reconnecting:'重新連接中'}:{waiting:'音声待機中',connecting:'翻訳サービスに接続中',live:'LIVE',draining:'最後の字幕を処理中',stopped:'停止中',unavailable:'サービス停止',reconnecting:'再接続中'};
let state='waiting',updated=null,lastEvent=Date.now();const events=new EventSource('/events/'+language);events.onmessage=e=>{const data=JSON.parse(e.data);state=data.state;updated=data.updated;lastEvent=Date.now();const changed=receiveText(data.text||'');render();if(changed&&document.querySelector('#follow').checked)window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};events.onerror=()=>{state='reconnecting';render()};function render(){s.textContent=states[state]||state;if(state==='live'&&updated&&Date.now()/1000-updated>20)s.textContent+=zh?' · 尚未收到新的字幕':' · 新しい字幕を待っています';}setInterval(render,2000);
</script></html>
