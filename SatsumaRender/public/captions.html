<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ライブ字幕</title><style>body{background:#0c211c;color:#f3f7ef;font-family:-apple-system,sans-serif;margin:0;padding:24px}header{position:sticky;top:0;background:#0c211c;padding:12px 0;border-bottom:1px solid #355147}h1{font-size:18px;margin:0 0 12px}.controls{display:flex;gap:16px;align-items:center}a,button{color:#c1dccb}button{background:#244539;border:0;padding:8px 12px;border-radius:6px}#text{font-size:28px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;margin:30px auto;max-width:900px}#state{color:#afd2bb;font-size:13px}footer{font-size:12px;color:#91b39f}</style><header><h1 id="title"></h1><div class="controls"><a href="/">言語選択</a><button id="small">文字 −</button><button id="large">文字 ＋</button><label><input type="checkbox" checked id="follow"> 自動スクロール</label></div><p id="state">接続中…</p></header><div id="text">字幕を待っています。</div><footer>AIによる翻訳字幕です。</footer><script>
const language=location.pathname.endsWith('/zh')?'zh':'ja', zh=language==='zh';document.documentElement.lang=zh?'zh-Hant':'ja';document.querySelector('#title').textContent=zh?'薩摩會議 繁體中文字幕':'薩摩会議 日本語字幕';let size=28;
const t=document.querySelector('#text'),s=document.querySelector('#state');document.querySelector('#small').onclick=()=>{size=Math.max(18,size-2);t.style.fontSize=size+'px'};document.querySelector('#large').onclick=()=>{size=Math.min(48,size+2);t.style.fontSize=size+'px'};
const states=zh?{waiting:'等待音訊',connecting:'連接翻譯服務',live:'LIVE',draining:'正在處理最後的字幕',stopped:'已停止',unavailable:'服務中斷',reconnecting:'重新連接中'}:{waiting:'音声待機中',connecting:'翻訳サービスに接続中',live:'LIVE',draining:'最後の字幕を処理中',stopped:'停止中',unavailable:'サービス停止',reconnecting:'再接続中'};
let state='waiting',updated=null,lastEvent=Date.now();const events=new EventSource('/events/'+language);events.onmessage=e=>{const data=JSON.parse(e.data);state=data.state;updated=data.updated;lastEvent=Date.now();t.textContent=data.text||(zh?'等待字幕。':'字幕を待っています。');render();if(document.querySelector('#follow').checked)window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};events.onerror=()=>{state='reconnecting';render()};function render(){s.textContent=states[state]||state;if(state==='live'&&updated&&Date.now()/1000-updated>20)s.textContent+=zh?' · 尚未收到新的字幕':' · 新しい字幕を待っています';}setInterval(render,2000);
</script></html>
